name: Functional tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  functional:
    name: Functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run functional test suite
        run: scripts/test-functional.sh
